services:
  jar:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: jar-app
    ports:
      - "5001:5001"
    environment:
      # LLM Provider: 'openai' or 'ollama' (default: openai)
      - LLM_PROVIDER=${LLM_PROVIDER:-openai}
      # OpenAI Configuration (when LLM_PROVIDER=openai)
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      # Ollama Configuration (when LLM_PROVIDER=ollama)
      - OLLAMA_MODEL=${OLLAMA_MODEL:-qwen2.5:14b}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://ollama:11434}
      # Optional: Flask secret key (will generate random if not provided)
      - SECRET_KEY=${SECRET_KEY:-}
      # Database path inside container
      - DATABASE_PATH=/app/data/oracle_pilot.db
      # Prometheus connection
      - PROMETHEUS_URL=http://prometheus:9090
      # Elasticsearch connection
      - ELASTICSEARCH_HOST=http://elasticsearch:9200
    volumes:
      # Persist database across container restarts
      - jar_data:/app/data
      # Optional: Mount source code for development (uncomment for live reload)
      # - .:/app
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:5001', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - jar-network
    depends_on:
      - prometheus
      - elasticsearch
      - ollama

  prometheus:
    image: prom/prometheus:latest
    container_name: jar-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    networks:
      - jar-network
    restart: unless-stopped

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
    container_name: jar-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
      - "9300:9300"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    networks:
      - jar-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped

  # Node Exporter for Prometheus to scrape system metrics
  node-exporter:
    image: prom/node-exporter:latest
    container_name: jar-node-exporter
    ports:
      - "9100:9100"
    networks:
      - jar-network
    restart: unless-stopped

  # Pushgateway for pushing custom metrics
  pushgateway:
    image: prom/pushgateway:latest
    container_name: jar-pushgateway
    ports:
      - "9091:9091"
    networks:
      - jar-network
    restart: unless-stopped

  # Ollama for local LLM inference (offline mode)
  ollama:
    image: ollama/ollama:latest
    container_name: jar-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - jar-network
    restart: unless-stopped
    # Uncomment below if you have NVIDIA GPU support
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

volumes:
  jar_data:
    driver: local
  prometheus_data:
    driver: local
  elasticsearch_data:
    driver: local
  ollama_data:
    driver: local

networks:
  jar-network:
    driver: bridge
