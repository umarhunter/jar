version: '3.8'

services:
  jar:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: jar-app
    ports:
      - "5000:5000"
    environment:
      # Required: OpenAI API key (load from .env file)
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      # Optional: Flask secret key (will generate random if not provided)
      - SECRET_KEY=${SECRET_KEY:-}
      # Database path inside container
      - DATABASE_PATH=/app/data/oracle_pilot.db
      # Optional: Elasticsearch connection (uncomment to use real Elasticsearch)
      # - ELASTICSEARCH_HOST=elasticsearch
      # - ELASTICSEARCH_PORT=9200
    volumes:
      # Persist database across container restarts
      - jar_data:/app/data
      # Optional: Mount source code for development (uncomment for live reload)
      # - .:/app
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:5000', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - jar-network
    # Uncomment to depend on Elasticsearch
    # depends_on:
    #   - elasticsearch

  # Uncomment this entire service to run a real Elasticsearch instance
  # elasticsearch:
  #   image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
  #   container_name: jar-elasticsearch
  #   environment:
  #     - discovery.type=single-node
  #     - xpack.security.enabled=false
  #     - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
  #   ports:
  #     - "9200:9200"
  #     - "9300:9300"
  #   volumes:
  #     - elasticsearch_data:/usr/share/elasticsearch/data
  #   networks:
  #     - jar-network
  #   healthcheck:
  #     test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
  #     interval: 30s
  #     timeout: 10s
  #     retries: 5
  #     start_period: 60s

volumes:
  jar_data:
    driver: local
  # Uncomment to persist Elasticsearch data
  # elasticsearch_data:
  #   driver: local

networks:
  jar-network:
    driver: bridge
