# Prometheus Configuration for JAR
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'jar-monitor'

# Scrape configurations
scrape_configs:
  # Prometheus itself
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Node Exporter - system metrics
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']
        labels:
          instance: 'jar-node'
          environment: 'production'

  # JAR Application (if it exposes metrics endpoint in the future)
  - job_name: 'jar-app'
    static_configs:
      - targets: ['jar:5000']
        labels:
          application: 'jar'
          environment: 'production'
    metrics_path: '/metrics'
    # This will fail until metrics endpoint is implemented, but won't break Prometheus
    scrape_timeout: 5s
