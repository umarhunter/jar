<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JAR - Observability Agent</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <header>
            <h1>Observability Agent</h1>
            <p class="subtitle">Natural Language Query Interface for System Metrics & Logs</p>
            <div id="connection-status" class="status-badge disconnected">Disconnected</div>
        </header>

        <div class="main-content">
            <!-- Chat/Query Interface -->
            <div class="query-section">
                <h2>Query Agent</h2>
                <form id="query-form">
                    <div class="input-group">
                        <input
                            type="text"
                            id="query-input"
                            placeholder="Ask me anything about system health, metrics, errors, or performance..."
                            autocomplete="off"
                        >
                        <button type="button" id="voice-btn" class="voice-btn" title="Click to speak">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path>
                                <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
                                <line x1="12" y1="19" x2="12" y2="23"></line>
                                <line x1="8" y1="23" x2="16" y2="23"></line>
                            </svg>
                        </button>
                        <button type="submit" id="submit-btn">
                            <span>Send Query</span>
                        </button>
                    </div>
                </form>

                <!-- Database Status Indicators -->
                <div class="database-indicators">
                    <div class="indicator" id="oracle-indicator">
                        <div class="indicator-icon">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/>
                            </svg>
                        </div>
                        <div class="indicator-content">
                            <div class="indicator-name">Oracle Database</div>
                            <div class="indicator-status">Idle</div>
                        </div>
                    </div>
                    <div class="indicator" id="prometheus-indicator">
                        <div class="indicator-icon">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/>
                            </svg>
                        </div>
                        <div class="indicator-content">
                            <div class="indicator-name">Prometheus</div>
                            <div class="indicator-status">Idle</div>
                        </div>
                    </div>
                    <div class="indicator" id="elasticsearch-indicator">
                        <div class="indicator-icon">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
                            </svg>
                        </div>
                        <div class="indicator-content">
                            <div class="indicator-name">Elasticsearch</div>
                            <div class="indicator-status">Idle</div>
                        </div>
                    </div>
                    <div class="indicator" id="analytics-indicator">
                        <div class="indicator-icon">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M3 3v18h18"/><path d="m19 9-5 5-4-4-3 3"/>
                            </svg>
                        </div>
                        <div class="indicator-content">
                            <div class="indicator-name">Analytics</div>
                            <div class="indicator-status">Idle</div>
                        </div>
                    </div>
                </div>

                <!-- Data Management Actions -->
                <div class="data-actions">
                    <button type="button" id="precompute-btn" class="action-btn" title="Recompute baselines and patterns from historical data">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8"/>
                            <path d="M21 3v5h-5"/>
                        </svg>
                        <span>Refresh Baselines</span>
                    </button>
                    <button type="button" id="populate-btn" class="action-btn" title="Regenerate all dummy data (Oracle, Prometheus, Elasticsearch)">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/>
                            <polyline points="3.27 6.96 12 12.01 20.73 6.96"/>
                            <line x1="12" y1="22.08" x2="12" y2="12"/>
                        </svg>
                        <span>Populate All Data</span>
                    </button>
                </div>
            </div>

            <!-- Agent Reasoning Display -->
            <div class="reasoning-section">
                <h2>Agent Activity & Reasoning</h2>
                <div id="reasoning-log" class="reasoning-log"></div>
            </div>

            <!-- Results Display -->
            <div class="results-section">
                <h2>Query Results</h2>
                <div id="results-display" class="results-display">
                    <div class="empty-state">
                        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" opacity="0.3">
                            <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
                        </svg>
                        <p>No queries yet. Start by asking about your system!</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
    <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
