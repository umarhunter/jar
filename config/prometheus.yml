# Prometheus Configuration for JAR
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'jar-monitor'

# Scrape configurations
scrape_configs:
  # Prometheus itself
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Node Exporter - system metrics
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']
        labels:
          instance: 'jar-node'
          environment: 'production'

  # JAR Application - Flask app metrics
  - job_name: 'jar-app'
    static_configs:
      - targets: ['jar:5001']
        labels:
          application: 'jar'
          environment: 'production'
    metrics_path: '/metrics'
    scrape_timeout: 5s

  # Pushgateway - for custom metrics from dummy data
  - job_name: 'pushgateway'
    honor_labels: true
    static_configs:
      - targets: ['pushgateway:9091']
    scrape_timeout: 5s
